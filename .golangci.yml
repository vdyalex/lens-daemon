run:
  timeout: 3m
  build-tags:
    - darwin

linters:
  enable:
    - errcheck      # unchecked errors
    - gosimple      # simplification suggestions
    - ineffassign   # assignments overwritten before use
    - staticcheck   # SA/S/QF checks (comprehensive)
    - unused        # unused code
  disable:
    - gochecknoglobals  # sentinel error vars are expected globals

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
